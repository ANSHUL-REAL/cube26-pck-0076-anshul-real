<form method="post" action="/records/{{ r.record_id }}/decision" data-busy style="margin-top:16px">
  <input type="hidden" name="decision" value="">
  <div class="form-row">
    <div>
      <label class="field" for="reason_code">Reason</label>
      <select id="reason_code" name="reason_code" required>
        <option value="" disabled selected>Choose a reason</option>
        {% for code, text in reasons.items() %}<option value="{{ code }}">{{ text }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="field" for="note">Note (optional)</label>
      <input type="text" id="note" name="note" maxlength="500" placeholder="What did you see?">
    </div>
  </div>
  <div class="decide">
    <button class="btn seal lg" type="submit" data-decision="SEAL">Seal the box</button>
    <button class="btn stop lg" type="submit" data-decision="STOP_AND_FIX">Stop and fix</button>
  </div>
  <div class="busy"><span class="spinner"></span>Saving…</div>
</form>
